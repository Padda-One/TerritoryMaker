# Chaîne d'approvisionnement — https://pnpm.io/supply-chain-security
# (pnpm >= 11 ne lit plus dans .npmrc que l'authentification et le registre)
engineStrict: true
minimumReleaseAge: 4320 # 3 jours, en minutes
blockExoticSubdeps: true
trustPolicy: no-downgrade
allowBuilds:
  esbuild: true
  sharp: true
minimumReleaseAgeExclude:
  - astro@7.3.4
  - '@astrojs/markdown-satteri@0.4.2'
overrides:
  vite: ">=8.0.13 <9"
  defu: ">=6.1.5 <7"
